name: Deploy staging

# Merging to `staging` applies migrations to the staging Supabase project.
# Vercel deploys the app itself from its own git integration; this workflow owns
# the database half of the promotion.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN        personal access token, from supabase.com/dashboard/account/tokens
#   STAGING_PROJECT_REF          the staging project ref
#   STAGING_DB_PASSWORD          the staging database password
#
# None of these grant access to production. Production credentials live in a
# separate GitHub Environment with its own approval gate.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false # never interrupt a migration mid-flight

jobs:
  migrate:
    name: apply migrations to staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fail early and loudly rather than half-configured.
      #
      # Asserting equality with the known staging ref, not merely inequality with
      # production, is deliberate. "Not production" would happily migrate some
      # third project that a mistyped or stale secret points at — and a migration
      # applied to the wrong project is not undone by fixing the secret.
      - name: Verify target is staging
        run: |
          PRODUCTION_REF=drdnqsjjxmqiklwfadmk
          STAGING_REF=ohgqgkraybpvnfdbgmvl
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::STAGING_PROJECT_REF is not set"; exit 1
          fi
          if [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::STAGING_PROJECT_REF is set to the PRODUCTION project. Refusing."
            exit 1
          fi
          if [ "$PROJECT_REF" != "$STAGING_REF" ]; then
            echo "::error::STAGING_PROJECT_REF is '$PROJECT_REF', expected the staging project '$STAGING_REF'. Refusing."
            exit 1
          fi
          echo "target: $PROJECT_REF (staging)"

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      # Show what is about to happen, in the log, before it happens.
      - name: Pending migrations
        run: supabase migration list --linked --password "$DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --linked --password "$DB_PASSWORD"

      # `supabase db push` has a documented failure mode in Actions where it
      # prompts, applies nothing, and still exits 0 — a green job that migrated
      # nothing. Never trust the exit code alone: assert that no local migration
      # is missing from the remote history table.
      - name: Verify migrations actually applied
        run: |
          set -o pipefail
          supabase migration list --linked --password "$DB_PASSWORD" | tee /tmp/migration-list.txt

          # Rows render as "  <local_version> | <remote_version> | <name>".
          # A local version with an empty remote column means it did not apply.
          PENDING=$(awk -F'|' '
            /^[[:space:]]*[0-9]{14}/ {
              gsub(/ /,"",$1); gsub(/ /,"",$2);
              if ($1 != "" && $2 == "") print $1
            }' /tmp/migration-list.txt)

          if [ -n "$PENDING" ]; then
            echo "::error::migrations still pending after push (the push silently did nothing):"
            echo "$PENDING"
            exit 1
          fi
          echo "all local migrations present in the remote history"

  seed:
    name: reseed staging with synthetic data
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    # Opt-in: run from the Actions tab when you want a clean staging dataset.
    # Not automatic, so a merge never wipes data someone is mid-way through
    # testing against.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Seed
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.STAGING_PROJECT_REF }}.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          # The scripts' guard is default-deny; without this it treats the
          # project as UNKNOWN and refuses, which is the intended behaviour.
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
        run: |
          npx tsx scripts/seed-supabase.ts --force
          npx tsx scripts/create-demo-users.ts
