name: Staging migration reconcile

# One-off reconciliation of STAGING's migration history.
#
# Staging was schema-aligned with production by `20260815220132`, a migration
# that only ever existed on the remote, so `supabase db push` refuses to run:
# it will not operate against a remote holding versions it cannot see. That
# version is now preserved in the repository as a history-reconciliation marker,
# and this workflow makes the remaining history agree.
#
# Reconciling needs the staging credentials, which live in this repo's `staging`
# GitHub Environment and cannot be read back out. So the work happens here
# rather than on a laptop, and no secret is copied anywhere.
#
# SCOPE — deliberately narrow:
#   * touches STAGING only; the guard below aborts on anything else
#   * `migration repair` writes to supabase_migrations.schema_migrations only,
#     executing none of the migration's SQL
#   * NO schema dumps, NO data dumps, NO copying anything between environments
#   * production is never contacted, read, or written

# TRIGGER: pushing the one-shot branch `chore/reconcile-staging-history`.
#
# Not `workflow_dispatch`: GitHub only offers manual dispatch for workflows that
# exist on the DEFAULT branch, and this one deliberately does not — `main` is the
# production branch, and putting it there would trigger a production deployment
# to land a staging-only maintenance job.
#
# Not `push: [staging]` either: repairing history on every staging push is the
# opposite of what a one-off reconciliation should do. The dedicated branch makes
# this run exactly once, on purpose, and is deleted afterwards.
on:
  push:
    branches: [chore/reconcile-staging-history]

env:
  # Staging already has this schema — it is the production-shaped baseline. Its
  # DDL must never re-run: 21 duplicate policies and 26 duplicate indexes.
  REPAIR_APPLIED: "20251125000000"

concurrency:
  group: staging-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: reconcile staging migration history
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Equality, not "is not production". A stale secret pointing at some third
      # project would otherwise be repaired and pushed to, and a migration
      # applied to the wrong database is not undone by fixing the secret.
      - name: Verify target is staging
        run: |
          PRODUCTION_REF=drdnqsjjxmqiklwfadmk
          STAGING_REF=ohgqgkraybpvnfdbgmvl
          echo "TARGET DATABASE: STAGING - $STAGING_REF"
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::STAGING_PROJECT_REF is not set"; exit 1
          fi
          if [ "$PROJECT_REF" = "$PRODUCTION_REF" ]; then
            echo "::error::PROJECT_REF is the PRODUCTION project. Refusing."; exit 1
          fi
          if [ "$PROJECT_REF" != "$STAGING_REF" ]; then
            echo "::error::PROJECT_REF is not the staging project. Refusing."; exit 1
          fi
          echo "confirmed: target is staging"

      - name: Link
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Migration list (before)
        run: supabase migration list --linked --password "$DB_PASSWORD"

      # Writes a history row and nothing else. The objects these versions
      # describe already exist on staging; re-running their DDL would fail on
      # duplicate policies and indexes, which is exactly what this avoids.
      - name: Repair history (no DDL executed)
        run: |
          for v in $REPAIR_APPLIED; do
            echo "::group::repair $v --status applied"
            supabase migration repair --status applied "$v" --linked --password "$DB_PASSWORD"
            echo "::endgroup::"
          done

      - name: Migration list (after repair)
        run: supabase migration list --linked --password "$DB_PASSWORD"

      # Applies only 20260814202134 (the measurements RLS fix). 20251125000000 is
      # now recorded as applied, and 20260815220132 already was, so both are
      # skipped rather than re-executed.
      #
      # --include-all is required because the fix is dated 2026-08-14, BEHIND the
      # already-applied 2026-08-15 alignment, and `db push` refuses to insert
      # behind the latest remote migration without it. That guard exists to stop
      # a migration written against an older schema landing on a newer one — here
      # the ordering is an artefact of the alignment being applied out of band,
      # and the fix is order-independent anyway: it drops a policy `if exists`
      # and creates a differently-named one. Safe, and verified below regardless.
      - name: Push remaining migrations
        run: supabase db push --linked --include-all --password "$DB_PASSWORD"

      # `db push` can prompt, apply nothing, and still exit 0. Assert the
      # history rather than trusting the exit code.
      - name: Verify nothing left pending
        run: |
          set -o pipefail
          supabase migration list --linked --password "$DB_PASSWORD" | tee /tmp/list.txt
          PENDING=$(awk -F'|' '
            /^[[:space:]]*[0-9]{14}/ {
              gsub(/ /,"",$1); gsub(/ /,"",$2);
              if ($1 != "" && $2 == "") print $1
            }' /tmp/list.txt)
          if [ -n "$PENDING" ]; then
            echo "::error::still pending after push:"; echo "$PENDING"; exit 1
          fi
          echo "staging migration history is consistent"
